<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Viaje Interior · El Umbral</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles_ritual.css" />

  <!-- Librerías necesarias -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <!-- Tu app (con defer para asegurar DOM listo y evitar bloqueos raros) -->
  <script src="app_ritual.js" defer></script>
</head>

<body>

  <div id="bg-estrellas"></div>

  <!-- Audio “ancla” (no estorba; ayuda a compatibilidad y pruebas) -->
  <audio id="audioGregoriano" preload="auto" loop playsinline>
    <source src="gregoriano.mp3" type="audio/mpeg" />
    <source src="gregoriano.ogg" type="audio/ogg" />
  </audio>

  <!-- ===== PANTALLA UMBRAL ===== -->
  <section id="umbral" class="pantalla">
    <div class="umbral-contenido">
      <h1>⚠ EL UMBRAL ⚠</h1>
      <p>
        Estás a punto de adentrarte en un territorio interior profundo,
        donde no existen máscaras ni respuestas cómodas.
      </p>
      <p>
        Este viaje exige honestidad absoluta.
        No hay respuestas correctas, solo verdades.
      </p>
      <p class="advertencia">
        Si decides cruzar, no podrás desandar lo visto.
      </p>

      <div class="umbral-botones">
        <button id="btnCruzar" type="button">Cruzar el Umbral</button>
        <button id="btnSalir" class="secundario" type="button">Retirarme</button>
      </div>
    </div>
  </section>

  <!-- ===== INICIO ===== -->
  <section id="inicio" class="pantalla oculto">
    <div class="inicio-contenido">
      <h2>Viaje Interior</h2>
      <button id="btnIniciar" type="button">Iniciar Cuestionario</button>
    </div>
  </section>

  <!-- ===== CONTENEDOR PREGUNTAS ===== -->
  <section id="contenedorPreguntas" class="pantalla"></section>

</body>
</html>
