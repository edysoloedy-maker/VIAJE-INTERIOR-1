<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verificación • Viaje Interior</title>
<style>
  body{font-family:system-ui;margin:0;background:#070A10;color:#E9E9F2}
  .wrap{max-width:860px;margin:0 auto;padding:28px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px}
  .ok{border-color:rgba(0,255,170,.35)} .bad{border-color:rgba(255,80,120,.35)}
  .pill{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:700}
  .pill.ok{background:rgba(0,255,170,.12);color:#66ffd6}
  .pill.bad{background:rgba(255,80,120,.12);color:#ff7aa1}
  code{background:rgba(255,255,255,.08);padding:3px 6px;border-radius:8px}
  a.btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:12px;
        background:rgba(155,220,255,.16);color:#9bdcff;text-decoration:none;border:1px solid rgba(155,220,255,.25)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Verificación de autenticidad</h1>
  <div id="box" class="card">
    <div><b>Estado:</b> <span id="status" class="pill">Cargando…</span></div>
    <p>Certificado: <code id="cert">—</code></p>
    <div id="info"></div>
    <div id="actions"></div>
  </div>
</div>

<script>
const REGISTRY_API_URL = "https://script.google.com/macros/s/AKfycbxD9kBjPPCBqs3YgBIcoKnOQsv2zTW4a-x2DC8OCepLYFhiFhTPME2D-8iYUaWU4LRh/exec";

const qs = new URLSearchParams(location.search);
const certId = (qs.get("cert")||"").trim();
const t = (qs.get("t")||"").trim();

const box=document.getElementById("box");
const status=document.getElementById("status");
const cert=document.getElementById("cert");
const info=document.getElementById("info");
const actions=document.getElementById("actions");

cert.textContent = certId || "—";

function setState(ok, html){
  status.textContent = ok ? "VÁLIDO" : "NO VÁLIDO";
  status.className = "pill " + (ok ? "ok" : "bad");
  box.className = "card " + (ok ? "ok" : "bad");
  info.innerHTML = html;
}

(async ()=>{
  if(!certId){ setState(false, "Falta <code>?cert=</code> en el QR."); return; }

  const url = `${REGISTRY_API_URL}?certId=${encodeURIComponent(certId)}`;
  const res = await fetch(url, {cache:"no-store"});
  const data = await res.json();

  if(!data.ok || !data.found){
    setState(false, `El certificado <code>${certId}</code> no existe en el registro oficial.`);
    return;
  }

  const r = data.data;

  // Validación con token (evita que inventen un certId)
  if(!t || t !== String(r.token||"")){
    setState(false, `El certificado existe, pero el <b>token no coincide</b>. Posible alteración.`);
    return;
  }

  setState(true, `
    <b>Nombre:</b> ${r.nombre || "—"}<br/>
    <b>Fecha:</b> ${r.fechaISO || "—"}<br/>
    <b>Tipo:</b> ${r.tipo || "—"}<br/>
  `);

  actions.innerHTML = r.pdfUrl
    ? `<a class="btn" href="${r.pdfUrl}" target="_blank" rel="noopener">Descargar PDF</a>`
    : `<div>No hay PDF asociado.</div>`;
})();
</script>
</body>
</html>
